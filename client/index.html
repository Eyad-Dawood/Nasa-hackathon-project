<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Multiplayer top-down pixel art game — 4 players, lobby system, role selection." />
  <title>NASA Deep Space Co-op</title>
  <!-- Google Fonts: Inter & JetBrains Mono for authentic NASA telemetry displays -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080a10;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #eef0f5;
    }

    #game-container {
      position: relative;
      z-index: 1;
    }

    #game-container canvas {
      display: block;
      /* Crisp pixels */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Monospace class for telemetry numbers */
    .mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    /* Quiet custom scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #07080d;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f2738;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2f3b52;
    }

    /* Typewriter blinking cursor */
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .ai-cursor {
      display: inline-block;
      width: 6px;
      height: 14px;
      background: #38bdf8;
      margin-left: 2px;
      vertical-align: middle;
      animation: blinkCursor 0.9s infinite;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
