## Render Blueprint – deploy via https://render.com/deploy
## This file describes the backend (Colyseus WebSocket server).
## The frontend (Vite/Phaser) is deployed separately on Cloudflare Pages.

services:
  - type: web
    name: game-server
    runtime: node
    plan: free

    # ── Build ──────────────────────────────────────────────
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start

    # ── Environment ────────────────────────────────────────
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false            # prompts you to enter this in the Render dashboard
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: ALLOWED_ORIGINS
        sync: false            # set to your Cloudflare Pages URL, e.g. https://my-game.pages.dev
